name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a production deploy halfway; superseded PR runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The template repo itself is all {{placeholders}}; everything runs in repos created from it.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for sitemap <lastmod> dates
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release checks (placeholders, filler copy, meta, JSON-LD, sitemap, assets)
        run: node tools/check.mjs

      - name: Build _site (drop authoring files, add sitemap lastmod)
        run: node tools/build.mjs

      - name: HTML validation
        run: npx --yes html-validate@11.21.1 "_site/**/*.html"

      - name: Internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/_site" "_site/**/*.html"
          fail: true

      - name: Lighthouse (performance, accessibility, SEO, best practices)
        run: npx --yes @lhci/cli@0.16.1 autorun

      - name: Keep Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  after-deploy:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test live site
        run: |
          url="${{ needs.deploy.outputs.page_url }}"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url") && [ "$code" = 200 ] && echo "$url -> 200" && exit 0
            echo "$url -> $code, retrying"; sleep 10
          done
          exit 1
      - name: Notify search engines (IndexNow -> Bing, ChatGPT search, Copilot)
        continue-on-error: true
        run: node tools/indexnow.mjs "${{ github.event.before }}"

<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>{{SUBJECT}}</title>
  <!-- Always the website's dark look: colours, font and radius come from the dark-mode values in
       src/css/styles.css (DARK_* tokens). Every element carries its own inline style, because many
       email apps drop <style> blocks. -->
  <style>
    @media (max-width: 480px) {
      .e-panel { padding: 28px 22px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:{{DARK_BG}};color:{{DARK_TEXT}};">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:{{DARK_BG}};">
    <tr>
      <td align="center" style="padding:28px 16px 40px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;">
          <tr>
            <td style="padding:0 4px 20px;">
              <a href="{{SITE_URL}}/" style="text-decoration:none;color:{{DARK_TEXT}};">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td width="36" height="36" align="center" valign="middle" style="width:36px;height:36px;border-radius:18px;background:{{DARK_ACCENT}};color:{{DARK_ACCENT_TEXT}};font:italic 20px/36px Georgia, 'Palatino Linotype', serif;">{{BRAND_INITIAL}}</td>
                    <td style="padding-left:10px;font:800 20px/1.2 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;letter-spacing:-0.02em;color:{{DARK_TEXT}};">{{BRAND}}</td>
                  </tr>
                </table>
              </a>
            </td>
          </tr>
          <tr>
            <td class="e-panel" style="background:{{DARK_CARD}};border-radius:{{DARK_RADIUS}};padding:36px 32px;font:16px/1.65 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;color:{{DARK_TEXT}};">
<!-- @content -->
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:28px 12px 0;font:13px/1.7 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;color:{{DARK_MUTED}};">
              <strong style="color:{{DARK_TEXT}};">{{BRAND}}</strong> · grupa biegowa dla kobiet w Krakowie<br>
              <a href="mailto:{{CONTACT_EMAIL}}" style="color:{{DARK_MUTED}};">{{CONTACT_EMAIL}}</a> · <a href="tel:+48570080490" style="color:{{DARK_MUTED}};text-decoration:none;">+48&nbsp;570&nbsp;080&nbsp;490</a><br>
              {{LEGAL_ENTITY}}<br>
              &copy; {{YEAR}} {{BRAND}} · <a href="{{SITE_URL}}/privacy.html" style="color:{{DARK_MUTED}};">Polityka prywatności</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

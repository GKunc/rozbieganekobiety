<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{BLOG_TITLE}} | {{BRAND}}</title>
  <meta name="description" content="{{BLOG_DESCRIPTION}}">
  <link rel="canonical" href="{{SITE_URL}}/blog/">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="{{THEME_COLOR}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{BRAND}}">
  <meta property="og:locale" content="{{LOCALE}}">
  <meta property="og:title" content="{{BLOG_TITLE}} | {{BRAND}}">
  <meta property="og:description" content="{{BLOG_DESCRIPTION}}">
  <meta property="og:url" content="{{SITE_URL}}/blog/">
  <meta property="og:image" content="{{SITE_URL}}/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">
  <link rel="alternate" type="application/rss+xml" title="{{BRAND}} blog" href="feed.xml">
  <link rel="stylesheet" href="../css/styles.css">
  <!-- analytics -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Blog",
        "@id": "{{SITE_URL}}/blog/#blog",
        "name": "{{BRAND}} blog",
        "url": "{{SITE_URL}}/blog/",
        "inLanguage": "{{LANG}}",
        "publisher": { "@id": "{{SITE_URL}}/#organization" }
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "{{BRAND}}", "item": "{{SITE_URL}}/" },
          { "@type": "ListItem", "position": 2, "name": "Blog", "item": "{{SITE_URL}}/blog/" }
        ]
      }
    ]
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="../">{{BRAND}}</a>
    <nav aria-label="Main">
      <a href="./">Blog</a>
      <a class="btn btn-small" href="../#contact">{{CTA_LABEL}}</a>
    </nav>
  </header>
  <main id="main" class="section">
    <h1>Blog</h1>
    <!-- The blog-post skill adds one <li> per post, newest first:
         <li><a href="slug.html">Title</a><br><time datetime="YYYY-MM-DD">YYYY-MM-DD</time> · one-sentence summary</li> -->
    <ul class="post-list" id="post-list">
    </ul>
  </main>
  <footer class="site-footer">
    <p>&copy; {{BRAND}} · <a href="../privacy.html">Privacy</a> · <a href="feed.xml">RSS</a></p>
  </footer>
</body>
</html>

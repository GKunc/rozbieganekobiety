<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{POST_TITLE}} | {{BRAND}}</title>
  <meta name="description" content="{{POST_DESCRIPTION}}">
  <link rel="canonical" href="{{SITE_URL}}/blog/{{SLUG}}.html">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="{{THEME_COLOR}}">
  <meta name="author" content="{{AUTHOR_NAME}}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="{{BRAND}}">
  <meta property="og:locale" content="{{LOCALE}}">
  <meta property="og:title" content="{{POST_TITLE}}">
  <meta property="og:description" content="{{POST_DESCRIPTION}}">
  <meta property="og:url" content="{{SITE_URL}}/blog/{{SLUG}}.html">
  <meta property="og:image" content="{{POST_IMAGE}}">
  <meta property="article:published_time" content="{{DATE}}">
  <meta property="article:modified_time" content="{{DATE_MODIFIED}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{POST_TITLE}}">
  <meta name="twitter:description" content="{{POST_DESCRIPTION}}">
  <meta name="twitter:image" content="{{POST_IMAGE}}">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">
  <link rel="alternate" type="application/rss+xml" title="{{BRAND}} blog" href="feed.xml">
  <link rel="stylesheet" href="../css/styles.css">
  <!-- analytics -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "BlogPosting",
        "@id": "{{SITE_URL}}/blog/{{SLUG}}.html#article",
        "headline": "{{POST_TITLE}}",
        "description": "{{POST_DESCRIPTION}}",
        "image": "{{POST_IMAGE}}",
        "datePublished": "{{DATE}}",
        "dateModified": "{{DATE_MODIFIED}}",
        "inLanguage": "{{LANG}}",
        "mainEntityOfPage": "{{SITE_URL}}/blog/{{SLUG}}.html",
        "author": { "@type": "Person", "name": "{{AUTHOR_NAME}}", "url": "{{AUTHOR_URL}}" },
        "publisher": { "@id": "{{SITE_URL}}/#organization" },
        "isPartOf": { "@id": "{{SITE_URL}}/blog/#blog" }
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "{{BRAND}}", "item": "{{SITE_URL}}/" },
          { "@type": "ListItem", "position": 2, "name": "Blog", "item": "{{SITE_URL}}/blog/" },
          { "@type": "ListItem", "position": 3, "name": "{{POST_TITLE}}", "item": "{{SITE_URL}}/blog/{{SLUG}}.html" }
        ]
      }
    ]
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="../">{{BRAND}}</a>
    <nav aria-label="Main">
      <a href="./">Blog</a>
      <a class="btn btn-small" href="../#contact">{{CTA_LABEL}}</a>
    </nav>
  </header>
  <main id="main" class="section">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol>
        <li><a href="../">{{BRAND}}</a></li>
        <li><a href="./">Blog</a></li>
        <li aria-current="page">{{POST_TITLE}}</li>
      </ol>
    </nav>
    <article>
      <h1>{{POST_TITLE}}</h1>
      <p class="post-meta">
        By {{AUTHOR_NAME}} · Published <time datetime="{{DATE}}">{{DATE}}</time>
        · Updated <time datetime="{{DATE_MODIFIED}}">{{DATE_MODIFIED}}</time>
      </p>
      {{POST_BODY}}
      <aside class="cta-box">
        <h2>{{CTA_HEADING}}</h2>
        <p>{{CTA_TEXT}}</p>
        <a class="btn" href="../#contact">{{CTA_LABEL}}</a>
      </aside>
    </article>
  </main>
  <footer class="site-footer">
    <p>&copy; {{BRAND}} · <a href="../privacy.html">Privacy</a> · <a href="feed.xml">RSS</a></p>
  </footer>
</body>
</html>
